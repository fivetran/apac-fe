sources:
  fivetran:
    type: snowflake
    account: '{{ env_var(''SF_ACCOUNT'') }}'
    user: '{{ env_var(''SF_USER'') }}'
    role: '{{ env_var(''SF_ROLE'') }}'
    warehouse: '{{ env_var(''SF_WAREHOUSE'') }}'
    database: NAAG_POSTGRES
    schema: NAAG_FIVETRAN_LOG
    private_key_path: '{{ env_var(''SF_PRIVATE_KEY_PATH'') }}'
    private_key_passphrase: '{{ env_var(''SF_PRIVATE_KEY_PASSPHRASE'', '''') }}'
    session_parameters:
      TIMEZONE: UTC
execution:
  max_workers: 1
  max_query_duration_seconds: 120
server:
  port: 3000
  debug: false
cloud:
  allow_public: false
